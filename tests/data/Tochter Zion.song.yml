  - type: stanza
    name: Strophe
    contents:
    - type: chords
      number: 1
      content: |
        d1 | d | a2. d4 | a1 | d2. a4 | b2:m d2:7 | g2 a | d1
        d1 | a2 b:m | e2:m e2 | fis1 | b:m | e2 e:7 | f4:m b:m e2 |
        a1 |
        d1 | d | a2. d4 | a1 | d2. a4 | b2:m d2:7 | g2 a | d1
    - type: voice
      number: 1
      content: |
        a'2 fis4.( g8 ) | a2 d, | e8( fis g a g4 ) fis | e1 \breathe |
        fis8( g a b a4 ) a | d2 a | g4( fis e4. ) d8 | d1 \breathe | \break
        fis8( e fis g fis4 ) fis4 | e2 d | g4( fis e ) d | cis1 \breathe |
        d8( cis d e d4 ) d | b'2 gis | a4( b8 a gis4. ) a8 | a1 \breathe | \break
        a2 fis4.( g8 ) | a2 d, | e8( fis g a g4 ) fis | e1 \breathe |
        fis8( g a b a4 ) a | d2 a | g4( fis e4. ) d8 | d1 \bar "|."
    - type: lyrics
      number: 1
      content: |
        Toch -- ter Zi -- on, fre -- ue dich!
        Jauch -- ze laut, Je -- ru -- sa -- lem!
        Sieh, dein Kö -- nig kommt zu dir!
        Ja, er kommt, der Frie -- dens -- fürst.
        Toch -- ter Zi -- on, fre -- ue dich!
        Jauch -- ze laut, Je -- ru -- sa -- lem!
    - type: lyrics
      number: 2
      content: |
        Ho -- si -- an -- na, Da -- vids Sohn,
        sei ge -- seg -- net dei -- nem Volk!
        Grün -- de nun dein ew’ -- ges Reich.
        Ho -- si -- an -- na in der Höh’.
        Ho -- si -- an -- na, Da -- vids Sohn,
        sei ge -- seg -- net dei -- nem Volk!
    - type: lyrics
      number: 3
      content: |
        Ho -- si -- an -- na, Da -- vids Sohn,
        sei ge -- grü -- ßet, Kö -- nig mild!
        E -- wig steht dein Frie -- dens -- thron,
        du, des ew’ -- gen Va -- ters Kind.
        Ho -- si -- an -- na, Da -- vids Sohn,
        sei ge -- grü -- ßet, Kö -- nig mild!
