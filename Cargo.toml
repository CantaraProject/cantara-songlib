[package]
name = "cantara-songlib"
authors = ["Jan Martin Reckel jm.reckel@t-online.de"]
description = "Functionalities to import, manage and export songs in various formats"
keywords = ["music", "sheets", "presentation"]
license = "AGPL-3.0"
version = "0.2.4"
edition = "2024"
repository = "https://github.com/CantaraProject/cantara-songlib"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = true

[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"   # Optimize for size.
lto = true
codegen-units = 1
panic = "abort"


[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
clap = { version = "4.6.5", features = ["derive"] }
handlebars = "6.4.3"
serde_yaml = "0.9"
tempfile = "3"

[build-dependencies]
cbindgen = "0.29"
